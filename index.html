<title>2026 遊戲熱度觀察</title>
<style>
:root{
  --panel:#1C2530; --blue:#5B8DB8; --gold:#D4A24C; --ink:#E8E4D8; --warn:#C8423B;
  --num:Bahnschrift,"DIN Alternate","Roboto Condensed","Arial Narrow",sans-serif;
  --zh:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;
  --t12:12px; --t14:14px; --t16:16px; --t18:18px; --t21:21px; --t24:24px; --t36:36px; --t48:48px; --t72:72px;
  --step:.4s; --push:.6s;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--panel);color:var(--ink);font:400 var(--t16)/1.7 var(--zh)}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.skip{position:absolute;left:8px;top:-60px;z-index:100;background:var(--ink);color:var(--panel);padding:8px 12px}
.skip:focus{top:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
[hidden]{display:none!important}
/* Task 6～9 的樣式依序加在下面，每段用「==== 區塊名 ====」註解標註 */
/* ==== plan ==== */
#plan{max-width:1120px;margin:0 auto;padding:24px 16px 96px}
#plan h1.hook{font:700 var(--t48)/1.2 var(--num);margin:24px 0 8px;text-wrap:balance}
#plan h2{font:700 var(--t36)/1.2 var(--zh);margin:48px 0 16px}
#plan h3{font:600 var(--t18)/1.4 var(--zh);margin:24px 0 8px}
#plan p{max-width:36em}
.times{font-size:var(--t12);line-height:1.5;opacity:.8}
.room-top,.room-extra{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.card{all:unset;display:flex;flex-direction:column;justify-content:flex-start;box-sizing:border-box;cursor:pointer;background:rgba(232,228,216,.04);border-left:3px solid var(--blue);padding:12px 14px;min-height:44px}
.card:focus-visible{outline:3px solid var(--gold)}
.card .rank{font-size:var(--t24);font-weight:600}
.card .name{font:600 var(--t18)/1.3 var(--zh);margin:4px 0;overflow-wrap:anywhere}
.card.is-open{background:rgba(232,228,216,.09)}
.card-back{margin-top:12px;font-size:var(--t16)}
.card-back h4{font:600 var(--t14)/1.4 var(--zh);margin:12px 0 4px}
.meta{margin:4px 0;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.meta .big{font-size:var(--t24);font-weight:600}
.meta .basis,.meta .now,.src{font-size:var(--t12);line-height:1.5;opacity:.85}
.badge{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;font-size:var(--t12);padding:0 6px;border:1px solid currentColor}
.badge::before{content:"";width:8px;height:8px}
.badge--steam_main{color:var(--blue)} .badge--steam_main::before{background:var(--blue);border-radius:50%}
.badge--steam_partial{color:var(--blue)} .badge--steam_partial::before{border:2px solid var(--blue);transform:rotate(45deg)}
.badge--cross_platform{color:var(--gold)} .badge--cross_platform::before{background:var(--gold)}
.badge--no_data{color:var(--ink);opacity:.6} .badge--no_data::before{background:var(--ink)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 0}
.tag{white-space:nowrap;font-size:var(--t12);padding:0 6px;background:rgba(232,228,216,.1)}
.tag--warn{background:var(--warn);color:var(--ink)}
.score{width:100%;border-collapse:collapse}
.score caption{text-align:left;font:600 var(--t18)/1.4 var(--zh);padding-bottom:8px}
.score th,.score td{padding:8px;text-align:left;border-bottom:1px solid rgba(232,228,216,.12)}
.score td.num,.score th{white-space:nowrap}
.score tr.team--blue td:first-child{border-left:3px solid var(--blue)}
.score tr.team--gold td:first-child{border-left:3px solid var(--gold)}
.linkish{all:unset;cursor:pointer;display:inline-block;text-decoration:underline;text-underline-offset:3px;min-height:44px;min-width:44px;box-sizing:border-box;padding:10px 0;line-height:1.5}
.vote{all:unset;cursor:pointer;display:inline-block;padding:10px 14px;margin:4px 8px 4px 0;border:1px solid var(--ink);min-height:44px}
.plan-rules li{overflow-wrap:anywhere}
.metric{border-collapse:collapse;width:100%}
.metric td,.metric th{padding:6px;border-bottom:1px solid rgba(232,228,216,.12);text-align:left;vertical-align:top}
@media (max-width:600px){ #plan h1.hook{font-size:var(--t36)} #plan h2{font-size:var(--t24)} .score th:nth-child(5),.score td:nth-child(5){display:none} .score th,.score td{padding:6px 4px} }

</style>
</head>

<script>
"use strict";
const GH = window.GH = {ready:false, handlers:{}};
GH.data = JSON.parse(document.getElementById("site-data").textContent);
GH.byId = Object.fromEntries(GH.data.games.map(g => [g.id, g]));
GH.roomsBySlug = Object.fromEntries(GH.data.rooms.map(r => [r.slug, r]));
GH.on = (ev, fn) => (GH.handlers[ev] ||= []).push(fn);
GH.emit = (ev, x) => (GH.handlers[ev] || []).forEach(fn => fn(x));

/* ==== fmt ==== */
GH.fmt = {
  num(n){
    if (n === null || n === undefined || Number.isNaN(n)) return "⚠️ 待查";
    if (n >= 10000) return (Math.round(n / 1000) / 10).toFixed(1) + " 萬";
    return Math.round(n).toLocaleString("en-US");
  },
  time(iso){
    if (!iso) return "⚠️ 待查";
    const d = new Date(iso), p = x => String(x).padStart(2, "0");
    const t = new Date(d.getTime() + (8 * 60 + d.getTimezoneOffset()) * 60000); // 一律顯示台灣時間
    return `${t.getFullYear()}/${p(t.getMonth()+1)}/${p(t.getDate())} ${p(t.getHours())}:${p(t.getMinutes())}`;
  },
  fill(text){
    return String(text || "").replace(/\{(\w+):([\w-]+)\}/g, (_, f, id) => {
      const g = GH.byId[id]; if (!g) return "⚠️ 待查";
      const v = g[f];
      return (f === "rank" || f === "months") ? (v ?? "⚠️ 待查") : GH.fmt.num(v);
    });
  },
};

/* ==== hash ==== */
GH.hash = {
  parse(str){
    const q = new URLSearchParams(String(str || "").replace(/^#/, ""));
    if (q.get("view") === "plan") return {view:"plan", room:null, game:null};
    const room = GH.roomsBySlug[q.get("room")] ? q.get("room") : null;
    const g = GH.byId[q.get("game")];
    const game = room && g && g.room_slug === room ? g.id : null;
    return {view:"walk", room, game};
  },
  serialize(s){
    if (s.view === "plan") return "#view=plan";
    if (!s.room) return "#";
    return "#room=" + s.room + (s.game ? "&game=" + encodeURIComponent(s.game) : "");
  },
};

/* ==== state ==== */
GH.state = GH.hash.parse(location.hash);
GH.go = (next, {push = true, animate = true} = {}) => {
  const prev = GH.state;
  GH.state = {view:"walk", room:null, game:null, ...next};
  const h = GH.hash.serialize(GH.state);
  if (push && h !== location.hash && !(h === "#" && !location.hash)) history.pushState(null, "", h || "#");
  GH.emit("state", {prev, next: GH.state, animate});
};
addEventListener("popstate", () => GH.go(GH.hash.parse(location.hash), {push:false, animate:true}));

/* Task 6～9 的模組依序加在下面 */
/* ==== card ==== */
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
GH.el = el;
const BADGE = {
  steam_main:["Steam 主力","PC 玩家主要從 Steam 進遊戲"],
  steam_partial:["只算 Steam 端","在 Steam 上架，但另有自家啟動器或主機的大量玩家"],
  cross_platform:["全平台","數字包含手機與主機；Steam 遊戲只算 PC 端"],
  no_data:["查不到人數","沒有任何公開的在線人數"],
};
GH.badge = g => { const [t, d] = BADGE[g.badge]; const b = el("span", "badge badge--" + g.badge, t); b.title = g.badge_note || d; return b; };
const snap = () => GH.fmt.time(GH.data.snapshot_at);
GH.meta = g => {
  const m = el("p", "meta");
  if (g.status === "ranked" || g.status === "dark_horse") {
    m.append(el("span", "num big", GH.fmt.num(g.score)), el("span", "basis", `${g.months} 個月的月峰值平均`));
  } else if (g.status === "no_monthly") {
    m.append(el("span", "basis", "⚠️ 無月度數據"));
  } else if (g.status === "spectator") {
    m.append(el("span", "basis", g.badge_note));
  } else {
    m.append(el("span", "basis", "口徑不同，不參與排名"));
  }
  if (g.status !== "spectator") {
    const now = el("span", "now"); now.append(el("span", "num", GH.fmt.num(g.now)), ` 當下（${snap()}）`);
    m.append(now);
  }
  return m;
};
const tag = (t, cls, title) => { const s = el("span", "tag" + (cls ? " " + cls : ""), t); if (title) s.title = title; return s; };
GH.card = g => {
  const c = el("button", "card"); c.type = "button"; c.dataset.id = g.id;
  c.setAttribute("aria-expanded", "false");
  const front = el("div", "card-front"), back = el("div", "card-back");
  if (g.room_rank) front.append(el("span", "rank num", "#" + g.room_rank));
  front.append(el("h3", "name", g.name), GH.badge(g), GH.meta(g));
  const tags = el("p", "tags");
  g.tags.forEach(t => tags.append(tag(t)));
  if (g.retention_tag) tags.append(tag(g.retention_tag, "tag--retention" + (g.retention_tag === "退燒中" ? " tag--warn" : ""),
    `當下 ÷ 30 日峰值 = ${Math.round(g.retention * 100)}%，當下人數抓取於 ${snap()}`));
  front.append(tags);
  const cp = g.copy || {};
  back.append(el("h3", "name", g.name));
  if (cp.intro) back.append(el("p", "intro", GH.fmt.fill(cp.intro)));
  if (cp.why_hot) { back.append(el("h4", null, "為什麼這麼多人玩")); back.append(el("p", null, GH.fmt.fill(cp.why_hot))); }
  (cp.memes || []).forEach(x => back.append(el("p", "meme", GH.fmt.fill(x))));
  if (cp.editor_note) back.append(el("p", "note", GH.fmt.fill(cp.editor_note)));
  const src = el("p", "src");
  src.textContent = `分房：${g.room_reason || "—"}｜數據：${g.steam_appids.length ? "Steam 官方排行 API、Steamcharts" : g.id === "fortnite" ? "fortnite.gg" : g.id === "roblox" ? "Rolimons" : "無公開數據"}｜24 小時峰值 ${GH.fmt.num(g.peak_24h)}｜30 日峰值 ${GH.fmt.num(g.peak_30d)}`;
  back.append(src);
  back.hidden = true;
  c.append(front, back);
  c.addEventListener("click", () => GH.toggleCard(c));
  return c;
};
GH.toggleCard = c => {
  const open = !c.classList.contains("is-open");
  document.querySelectorAll(".card.is-open").forEach(x => { x.classList.remove("is-open"); x.setAttribute("aria-expanded", "false"); x.querySelector(".card-back").hidden = true; });
  if (open) { c.classList.add("is-open"); c.setAttribute("aria-expanded", "true"); c.querySelector(".card-back").hidden = false; }
  GH.emit("card", {id: open ? c.dataset.id : null});
};

/* ==== plan ==== */
const roomGames = slug => GH.data.games.filter(g => g.room_slug === slug);
GH.roomTop = slug => roomGames(slug).filter(g => g.room_rank && g.room_rank <= 5).sort((a, b) => a.room_rank - b.room_rank);
GH.roomExtra = slug => ({
  dark: roomGames(slug).filter(g => g.status === "dark_horse"),
  none: roomGames(slug).filter(g => g.status === "no_monthly"),
});
GH.scoreTable = () => {
  const t = el("table", "score");
  t.innerHTML = "<caption>總計分板：2026 年 1～" + Number(GH.data.period.to.slice(5)) + " 月月峰值平均 Top 10</caption><thead><tr><th>名次</th><th>遊戲</th><th>熱度分</th><th>平台</th><th>房間</th></tr></thead>";
  const tb = el("tbody");
  GH.data.games.filter(g => g.rank && g.rank <= 10).sort((a, b) => a.rank - b.rank).forEach(g => {
    const tr = el("tr", "team--" + (g.badge === "cross_platform" ? "gold" : "blue")); tr.dataset.id = g.id;
    tr.append(el("td", "num", g.rank));
    const name = el("td"); const a = el("button", "linkish", g.name); a.type = "button";
    a.addEventListener("click", () => GH.go({room: g.room_slug, game: g.id})); name.append(a); g.tags.forEach(x => name.append(tag(x)));
    if (g.retention_tag) name.append(tag(g.retention_tag, "tag--retention" + (g.retention_tag === "退燒中" ? " tag--warn" : ""), `當下人數抓取於 ${snap()}`));
    const b = el("td"); b.append(GH.badge(g));
    tr.append(name, el("td", "num", GH.fmt.num(g.score)), b, el("td", null, g.room));
    tb.append(tr);
  });
  const rb = GH.byId.roblox;
  if (rb) { const tr = el("tr", "unranked"); tr.innerHTML = `<td>—</td><td>${rb.name}</td><td class="num">${GH.fmt.num(rb.now)} 當下</td><td></td><td>口徑不同，不參與排名</td>`; tb.append(tr); }
  t.append(tb);
  const spect = el("p", "spectators", "觀戰者：" + GH.data.games.filter(g => g.status === "spectator").map(g => g.name).join("、"));
  const wrap = el("div"); wrap.append(t, spect); return wrap;
};
GH.plan = {
  render(){
    const root = document.getElementById("plan"); root.textContent = "";
    const cp = GH.data.copy;
    const spawn = el("section", "plan-spawn"); spawn.id = "plan-spawn";
    spawn.append(el("h1", "hook", GH.fmt.fill(cp.hook?.headline)), el("p", null, GH.fmt.fill(cp.hook?.sub)),
      el("p", "times", `月度數據：${GH.data.period.from.replace("-", "/")}～${GH.data.period.to.replace("-", "/")}｜當下人數抓取於 ${snap()}（台灣時間）`),
      el("p", "cloud", cp.spawn_note));
    root.append(spawn);
    GH.data.rooms.slice().sort((a, b) => a.order - b.order).forEach(r => {
      const s = el("section", "plan-room"); s.dataset.room = r.slug;
      s.append(el("h2", null, r.name));
      const top = el("div", "room-top"); GH.roomTop(r.slug).forEach(g => top.append(GH.card(g))); s.append(top);
      const {dark, none} = GH.roomExtra(r.slug);
      if (dark.length) { s.append(el("h3", null, "黑馬（未滿 3 個月，不給名次）")); const d = el("div", "room-extra"); dark.forEach(g => d.append(GH.card(g))); s.append(d); }
      if (none.length) { s.append(el("h3", null, "⚠️ 無月度數據")); const d = el("div", "room-extra"); none.forEach(g => d.append(GH.card(g))); s.append(d); }
      root.append(s);
    });
    const sb = el("section", "plan-score"); sb.append(GH.scoreTable()); root.append(sb);
    const sp = el("section", "plan-spectators"); sp.id = "plan-spectators";
    sp.append(el("h2", null, "觀戰席"), el("p", "quote", cp.spectator_quote), el("p", null, cp.spectator_note));
    GH.data.games.filter(g => g.status === "spectator").forEach(g => sp.append(GH.card(g)));
    root.append(sp);
    root.append(GH.graffiti());
    root.append(GH.rulesWall());
  },
};
GH.graffiti = () => {
  const s = el("section", "plan-graffiti"); s.id = "plan-graffiti";
  const v = GH.data.copy.vote || {options:[]};
  s.append(el("h2", null, "塗鴉牆"), el("p", null, v.question), el("p", "times", v.note));
  const res = el("p", "vote-result");
  const show = () => { const k = localStorage.getItem("gh.vote"); res.textContent = k == null ? "" : `你選了「${v.options[k]}」。投票只記在你的瀏覽器，不是全站統計。`; };
  v.options.forEach((o, i) => { const b = el("button", "vote", o); b.type = "button"; b.addEventListener("click", () => { localStorage.setItem("gh.vote", i); show(); }); s.append(b); });
  s.append(res);
  s.append(el("h3", null, GH.data.copy.pain_title), el("p", null, GH.data.copy.pain_question));
  const ul = el("ul", "pain"); (GH.data.copy.pain_points || []).forEach(x => ul.append(el("li", null, x))); s.append(ul);
  show(); return s;
};
GH.rulesWall = () => {
  const s = el("section", "plan-rules"); s.id = "plan-rules";
  s.append(el("h2", null, "規則牆"), el("p", null, GH.data.copy.rules_note));
  const mt = el("table", "metric"); mt.innerHTML = "<thead><tr><th>指標</th><th>能證明</th><th>不能證明</th></tr></thead>";
  const mb = el("tbody"); (GH.data.copy.metric_table || []).forEach(r => { const tr = el("tr"); tr.append(el("td", null, r.metric), el("td", null, r.proves), el("td", null, r.cannot_prove)); mb.append(tr); });
  mt.append(mb); s.append(mt);
  s.append(el("p", null, "候選名單：抓取當天 Steam 前 100 名，加上 Fortnite、Roblox。年初很紅、現在退燒的遊戲不會出現。"));
  s.append(el("h3", null, "人工修正清單"));
  const ot = el("ul"); GH.data.overrides.forEach(o => ot.append(el("li", null, `${o.name} → ${o.to}：${o.reason}`))); s.append(ot);
  s.append(el("h3", null, "數據來源"));
  const src = el("ul"); GH.data.sources.forEach(x => src.append(el("li", null, `${x.id}：${x.url}（${x.ok ? "抓取於 " + GH.fmt.time(x.fetched_at) : "抓取失敗"}）`))); s.append(src);
  return s;
};
GH.on("state", ({next}) => {
  const plan = next.view === "plan";
  document.getElementById("plan").hidden = !plan;
  document.getElementById("scene").hidden = plan;
  if (plan && !document.querySelector("#plan section")) GH.plan.render();
});
if (matchMedia("(prefers-reduced-motion: reduce)").matches && !location.hash) GH.state = {view:"plan", room:null, game:null};


GH.emit("state", {prev:null, next:GH.state, animate:false});
GH.ready = true; // 放在第一次渲染之後：測試等到 ready 時畫面已經是網址指定的狀態
</script>
</body>
</html>
